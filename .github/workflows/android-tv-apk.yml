name: Android TV APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete Flutter Android generated files
        run: |
          flutter create --platforms=android --project-name=live_tv_remote --org=com.example --no-pub .
          flutter pub get

      - name: Verify Android Gradle compatibility
        run: python3 tools/check_android_toolchain.py

      - name: Verify release-only SharedPreferences JNI regression workaround
        run: |
          python3 tools/check_shared_preferences_runtime.py
          flutter pub deps --style=compact | grep shared_preferences_android

      - name: Check independent native Crash Finder setup
        run: python3 tools/check_crash_finder.py

      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build Android TV APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Build diagnostic TV APK (debug, separate install)
        if: always()
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload diagnostic APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Remote-AndroidTV-Diagnostic-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      # Preserve R8's generated diagnostics on a failed build. If a future
      # plugin adds a genuinely required dependency, the next error remains visible.
      - name: Upload Android build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Remote-Android-R8-Diagnostics
          path: build/app/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Remote-AndroidTV-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
