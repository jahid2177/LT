name: Android TV APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# "contents: write" lets the job publish a GitHub Release for a new version.
permissions:
  contents: write

concurrency:
  group: android-tv-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repository secrets (Settings > Secrets and variables > Actions).
      # Empty on pull requests from forks and until the secrets are added.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: an unpinned "stable" changed the required Gradle/AGP
          # versions under this project before. Bump deliberately.
          flutter-version: 3.47.7
          cache: true

      - name: Prepare stable release signing key
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release APK will be signed with the stable key."
          else
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing. The APK is signed with a throw-away debug key and NO GitHub Release is published."
          fi

      - name: Complete Flutter Android generated files
        run: |
          flutter create --platforms=android --project-name=live_tv_remote --org=com.example --no-pub .
          flutter pub get

      - name: Verify Android Gradle compatibility
        run: python3 tools/check_android_toolchain.py

      - name: Verify release-only SharedPreferences JNI regression workaround
        run: |
          python3 tools/check_shared_preferences_runtime.py
          flutter pub deps --style=compact | grep shared_preferences_android

      - name: Check independent native Crash Finder setup
        run: python3 tools/check_crash_finder.py

      - name: Verify Android TV Keep Screen Awake wiring
        run: python3 tools/check_screen_awake.py

      - name: Verify GitHub primary channel catalog policy
        run: python3 tools/check_github_primary_policy.py

      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos

      - name: Validate bundled offline fallback JSON (variable channel count)
        run: python3 tools/check_bundled_channels.py

      - name: Unit tests
        run: flutter test -r expanded

      - name: Build universal TV APK (32-bit ARM + 64-bit ARM)
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Verify the APK contains a 32-bit ARM Flutter engine
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -F 'lib/armeabi-v7a/libflutter.so'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -F 'lib/armeabi-v7a/libapp.so'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -F 'lib/arm64-v8a/libflutter.so' 

      - name: Show the release APK signing certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256' || true

      - name: Build diagnostic TV APK (debug, separate install)
        if: always()
        run: flutter build apk --debug --target-platform android-arm

      - name: Upload diagnostic APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Remote-AndroidTV-ARM32-Diagnostic-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      # Preserve R8's generated diagnostics on a failed build. If a future
      # plugin adds a genuinely required dependency, the next error remains visible.
      - name: Upload Android build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Remote-Android-R8-Diagnostics
          path: build/app/outputs/mapping/release/missing_rules.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live-TV-Remote-AndroidTV-ARM32-ARM64-Universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # A new GitHub Release is what the installed TV app looks for. It is
      # published once per version: change "version:" in pubspec.yaml (both the
      # name and the +build number) and push to main.
      - name: Publish GitHub Release for a new version
        if: env.RELEASE_SIGNED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_LINE="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | tr -d '[:space:]')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          case "$VERSION_LINE" in *+*) ;; *) echo "pubspec version needs a +build number"; exit 1 ;; esac
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "Invalid build number: $VERSION_CODE"; exit 1 ;; esac
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish. Bump the version in pubspec.yaml to release again."
            exit 0
          fi
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/live-tv-remote.apk
          APK_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/live-tv-remote.apk"
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" > release/version.json
          cat release/version.json
          gh release create "$TAG" release/live-tv-remote.apk release/version.json \
            --target "$GITHUB_SHA" \
            --title "Live TV Remote $VERSION_NAME" \
            --notes "Android TV / Google TV APK (ARM32 + ARM64), build $VERSION_CODE. Installed copies of the app offer this update automatically."
