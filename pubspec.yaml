name: live_tv_remote
description: Remote-first Flutter IPTV application for Android TV (user-provided, authorized M3U streams).
publish_to: none
version: 1.1.4+6

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  # 2.5.0 has a release-only JNI/R8 NoSuchMethodError in getAll on Android TV.
  # Pin the endorsed Android implementation until an upstream fix is verified.
  shared_preferences_android: 2.4.28
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo_playlist.m3u
    - assets/channels.json
